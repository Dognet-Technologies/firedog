name: Lint & Code Quality

on:
  push:
    branches: [main, stabile]
  pull_request:
    branches: [main, stabile]

jobs:
  python-lint:
    name: Python (Black + Bandit)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install linting tools
        run: pip install black bandit

      - name: Black format check
        working-directory: backend
        run: black --check --diff --exclude "venv/" .

      - name: Bandit security scan
        working-directory: backend
        run: |
          bandit -r . \
            --exclude ./venv,./migrations \
            --severity-level medium \
            --confidence-level medium \
            --exit-zero \
            -f json -o bandit-report.json
          bandit -r . \
            --exclude ./venv,./migrations \
            --severity-level medium \
            --confidence-level medium \
            --exit-zero

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: bandit-security-report
          path: backend/bandit-report.json
          retention-days: 30

  frontend-lint:
    name: Frontend (ESLint + TypeScript)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v6.3.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: ESLint
        working-directory: frontend
        run: npx eslint src/ --ext .ts,.tsx || true

      - name: TypeScript type check
        working-directory: frontend
        run: npx tsc --noEmit
