# FireDog — site nginx con TLS (default di deploy/install.sh)
# Certificato self-signed generato dall'installer, pensato per uso interno
# in LAN. Per esporre l'istanza su internet con un dominio reale e un
# certificato Let's Encrypt/certbot valido, vedi INSTALL.md (sezione HTTPS).
# Placeholder __FIREDOG_*__ sostituiti da deploy/install.sh in fase di
# copia in /etc/nginx/sites-available/firedog.

server {
    listen 80;
    listen [::]:80;
    server_name __FIREDOG_SERVER_NAME__;

    # Esente dal redirect: validazione ACME HTTP-01 di un futuro certbot
    # (vedi INSTALL.md) — deve restare raggiungibile in chiaro su :80.
    location /.well-known/acme-challenge/ {
        root __FIREDOG_DIR__/frontend/build;
    }

    # Esente dal redirect: dog-agent si connette storicamente in ws:// in
    # chiaro su :80 (config esistenti hanno `url = "ws://<master>"` senza
    # scheme https — vedi ws_url() in dog_agent/src/config.rs, fa solo una
    # sostituzione di stringa sullo scheme già presente). Un 301 qui rompe
    # l'handshake WebSocket per l'intera flotta di agent già deployata:
    # bug reale trovato testando il pairing con lab-client1/lab-client2
    # dopo il passaggio a HTTPS-by-default. Restare in chiaro qui è
    # intenzionale, non un'eccezione temporanea: cambiare a wss:// è
    # un'operazione futura che tocca ogni agent.conf, fuori scope qui.
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __FIREDOG_SERVER_NAME__;

    ssl_certificate     /etc/ssl/firedog/firedog.crt;
    ssl_certificate_key /etc/ssl/firedog/firedog.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root __FIREDOG_DIR__/frontend/build;
    index index.html;

    # SPA React: fallback su index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static Django (admin, DRF browsable)
    location /dj-static/ {
        alias __FIREDOG_DIR__/backend/staticfiles/;
    }

    # API REST + MCP
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket (agent + streaming log)
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600;
    }
}
