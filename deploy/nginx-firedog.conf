# FireDog — site nginx solo-HTTP (nessun TLS)
# Usato da deploy/install.sh quando invocato con --skip-tls, altrimenti
# il default è deploy/templates/nginx-firedog-https.conf. Installazione
# manuale: sostituisci i placeholder __FIREDOG_*__, poi
#   sudo cp deploy/nginx-firedog.conf /etc/nginx/sites-available/firedog
#   sudo ln -s /etc/nginx/sites-available/firedog /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name __FIREDOG_SERVER_NAME__;

    root __FIREDOG_DIR__/frontend/build;
    index index.html;

    # SPA React: fallback su index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static Django (admin, DRF browsable)
    location /dj-static/ {
        alias __FIREDOG_DIR__/backend/staticfiles/;
    }

    # API REST + MCP
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket (agent + streaming log)
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600;
    }
}
