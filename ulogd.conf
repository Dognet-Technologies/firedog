# Configurazione ulogd2 per firewall logging
# File: /etc/ulogd.conf

[global]
######################################################################
# GLOBAL OPTIONS
######################################################################

logfile="/var/log/ulogd/ulogd.log"
loglevel=5

# Plugin stack per PCAP
plugin="/usr/lib/x86_64-linux-gnu/ulogd/ulogd_inppkt_NFLOG.so"
plugin="/usr/lib/x86_64-linux-gnu/ulogd/ulogd_filter_IFINDEX.so"
plugin="/usr/lib/x86_64-linux-gnu/ulogd/ulogd_filter_IP2STR.so"
plugin="/usr/lib/x86_64-linux-gnu/ulogd/ulogd_filter_PRINTPKT.so"
plugin="/usr/lib/x86_64-linux-gnu/ulogd/ulogd_output_PCAP.so"
plugin="/usr/lib/x86_64-linux-gnu/ulogd/ulogd_raw2packet_BASE.so"

######################################################################
# STACK per INPUT DROP - NFLOG group 1
######################################################################

stack=log_input:NFLOG,base1:BASE,ifi1:IFINDEX,ip2str1:IP2STR,print1:PRINTPKT,pcap_input:PCAP

[log_input]
group=1
bind=1
# Buffer per gestire burst di pacchetti
nlbufsiz=1048576
# Copia tutto il pacchetto
snaplen=65535

[base1]

[ifi1]

[ip2str1]

[print1]

[pcap_input]
# File di output per traffico INPUT bloccato
file="/var/log/ulogd/input_dropped.pcap"
# Sync ogni 128 pacchetti per performance
sync=128

######################################################################
# STACK per OUTPUT DROP - NFLOG group 2
######################################################################

stack=log_output:NFLOG,base2:BASE,ifi2:IFINDEX,ip2str2:IP2STR,print2:PRINTPKT,pcap_output:PCAP

[log_output]
group=2
bind=1
nlbufsiz=1048576
snaplen=65535

[base2]

[ifi2]

[ip2str2]

[print2]

[pcap_output]
# File di output per traffico OUTPUT bloccato
file="/var/log/ulogd/output_dropped.pcap"
sync=128
